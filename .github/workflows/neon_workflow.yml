name: Create/Delete Branch for Pull Request

# One Neon preview branch per PR in the soft-art project (vars.NEON_PROJECT_ID).
# Never point this at the production project.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

# Keyed on the PR number so create/sync/close for one PR serialize. Only
# superseded pushes are cancelled; a close event is never cancelled (and never
# cancels an in-flight create), so the delete always runs.
concurrency:
  group: neon-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

permissions:
  contents: read

env:
  # Same name for create, schema diff and delete, derived from the PR number
  # only (no tj-actions/branch-names, which has a supply-chain compromise
  # history). github.head_ref is deliberately NOT used: delete-branch-action
  # interpolates inputs.branch straight into bash with NEON_API_KEY in env, so
  # a crafted branch name would be command injection, and a renamed head
  # branch would orphan the original preview branch.
  NEON_BRANCH_NAME: preview/pr-${{ github.event.pull_request.number }}

jobs:
  create_neon_branch:
    name: Create Neon Branch
    # Dependabot and fork PRs run without NEON_API_KEY, so the action can only fail.
    if: |
      github.event.action != 'closed'
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      branch_id: ${{ steps.create_neon_branch.outputs.branch_id }}
    permissions:
      contents: read
      pull-requests: write # schema-diff-action posts/updates one PR comment
    steps:
      - name: Compute branch expiration (14 days)
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6.3.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      - name: Mask connection details
        env:
          DB_URL: ${{ steps.create_neon_branch.outputs.db_url }}
          DB_URL_POOLED: ${{ steps.create_neon_branch.outputs.db_url_pooled }}
          DB_HOST: ${{ steps.create_neon_branch.outputs.db_host }}
          DB_HOST_POOLED: ${{ steps.create_neon_branch.outputs.db_host_pooled }}
          DB_PASSWORD: ${{ steps.create_neon_branch.outputs.password }}
        run: |
          for v in "$DB_URL" "$DB_URL_POOLED" "$DB_HOST" "$DB_HOST_POOLED" "$DB_PASSWORD"; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done

      # Preview branches are copy-on-write children of main, so they start with
      # main's schema. chat:migrate is ledger-backed and idempotent: it applies
      # only new migration ids and re-asserts the fleet_pi_app grants.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run chat migrations on the preview branch
        run: pnpm chat:migrate
        env:
          # Direct (unpooled) owner connection: DDL + one interactive
          # transaction must not go through PgBouncer. Never echo this value.
          FLEET_PI_CHAT_MIGRATION_DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}

      - name: Run Better Auth migrations on the preview branch
        run: pnpm auth:migrate
        env:
          FLEET_PI_AUTH_MIGRATION_DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}
          # Schema generation only; no sessions are signed with this value.
          BETTER_AUTH_SECRET: ci-preview-migration-placeholder-secret
          BETTER_AUTH_URL: https://preview.invalid

      - name: Post schema diff comment to PR
        uses: neondatabase/schema-diff-action@80cfa8521628e890015b60f5291a7738926617dc # v1.0.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          compare_branch: ${{ env.NEON_BRANCH_NAME }}
          base_branch: main
          api_key: ${{ secrets.NEON_API_KEY }}

  delete_neon_branch:
    name: Delete Neon Branch
    if: |
      github.event.action == 'closed'
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}
