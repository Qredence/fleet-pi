name: Cloudflare Workers

# Production: every push to main deploys the Worker (fleet-pi-web) to
# workers.dev. Preview: PRs labelled `cloudflare-preview` deploy a Worker
# Preview named `pr-<number>` with Neon preview-branch secrets only (never
# production database or auth URLs). Opt-in via label; skipped for forks and
# Dependabot.
#
# Requires repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit),
# CLOUDFLARE_ACCOUNT_ID, NEON_API_KEY, FLEET_PI_PRODUCTION_CHAT_DATABASE_URL,
# FLEET_PI_PRODUCTION_NEON_AUTH_BASE_URL, PREVIEW_* auth/gateway secrets, and the
# repo variable NEON_PROJECT_ID (non-production soft-art). Production builds
# use vars.VITE_NEON_AUTH_URL; preview builds use secrets.PREVIEW_VITE_NEON_AUTH_URL.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Worker
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'cloudflare-preview') &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_PUBLIC_POSTHOG_KEY: ${{ vars.VITE_PUBLIC_POSTHOG_KEY }}
      VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
              echo "::error::Production deploy failed: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not configured"
              exit 1
            fi
            echo "::warning::Deploy skipped: no Cloudflare credentials"
            echo "⚠️ Deploy skipped: no Cloudflare credentials (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not configured)." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        if: steps.creds.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.creds.outputs.ready == 'true'
        run: pnpm typecheck

      - name: Unit tests
        if: steps.creds.outputs.ready == 'true'
        run: pnpm test

      - name: Build Worker (production)
        if: steps.creds.outputs.ready == 'true' && github.event_name != 'pull_request'
        working-directory: apps/web
        env:
          VITE_NEON_AUTH_URL: ${{ vars.VITE_NEON_AUTH_URL }}
        run: pnpm build:cloudflare

      - name: Build Worker (preview)
        if: steps.creds.outputs.ready == 'true' && github.event_name == 'pull_request'
        working-directory: apps/web
        env:
          VITE_NEON_AUTH_URL: ${{ secrets.PREVIEW_VITE_NEON_AUTH_URL }}
        run: pnpm build:cloudflare

      - name: Deploy production
        if: steps.creds.outputs.ready == 'true' && github.event_name != 'pull_request'
        working-directory: apps/web
        run: pnpm exec wrangler deploy --message "${GITHUB_SHA::7}"

      - name: Validate preview database isolation
        if: steps.creds.outputs.ready == 'true' && github.event_name == 'pull_request'
        working-directory: apps/web
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          FLEET_PI_PRODUCTION_CHAT_DATABASE_URL: ${{ secrets.FLEET_PI_PRODUCTION_CHAT_DATABASE_URL }}
          FLEET_PI_PRODUCTION_NEON_AUTH_BASE_URL: ${{ secrets.FLEET_PI_PRODUCTION_NEON_AUTH_BASE_URL }}
          PREVIEW_NEON_AUTH_BASE_URL: ${{ secrets.PREVIEW_NEON_AUTH_BASE_URL }}
        run: >-
          pnpm exec tsx scripts/cloudflare/assert-preview-worker-secrets.ts
          validate
          --pr ${{ github.event.pull_request.number }}

      - name: Deploy Cloudflare preview
        if: steps.creds.outputs.ready == 'true' && github.event_name == 'pull_request'
        id: preview_deploy
        working-directory: apps/web
        run: |
          set -euo pipefail
          pnpm exec wrangler preview \
            --name "pr-${{ github.event.pull_request.number }}" \
            --ignore-base-config \
            --message "PR #${{ github.event.pull_request.number }} @ ${GITHUB_SHA::7}" \
            --json > preview-deploy.json

      - name: Write preview Worker secrets file
        if: steps.creds.outputs.ready == 'true' && github.event_name == 'pull_request'
        id: preview_secrets
        working-directory: apps/web
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          FLEET_PI_PRODUCTION_CHAT_DATABASE_URL: ${{ secrets.FLEET_PI_PRODUCTION_CHAT_DATABASE_URL }}
          FLEET_PI_PRODUCTION_NEON_AUTH_BASE_URL: ${{ secrets.FLEET_PI_PRODUCTION_NEON_AUTH_BASE_URL }}
          PREVIEW_NEON_AUTH_BASE_URL: ${{ secrets.PREVIEW_NEON_AUTH_BASE_URL }}
          PREVIEW_NEON_AUTH_JWKS_URL: ${{ secrets.PREVIEW_NEON_AUTH_JWKS_URL }}
          PREVIEW_NEON_AUTH_ISSUER: ${{ secrets.PREVIEW_NEON_AUTH_ISSUER }}
          PREVIEW_NEON_AUTH_COOKIE_SECRET: ${{ secrets.PREVIEW_NEON_AUTH_COOKIE_SECRET }}
          PREVIEW_BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
          PREVIEW_VITE_NEON_AUTH_URL: ${{ secrets.PREVIEW_VITE_NEON_AUTH_URL }}
          PREVIEW_NEON_AI_GATEWAY_TOKEN: ${{ secrets.PREVIEW_NEON_AI_GATEWAY_TOKEN }}
          PREVIEW_NEON_AI_GATEWAY_BASE_URL: ${{ secrets.PREVIEW_NEON_AI_GATEWAY_BASE_URL }}
        run: |
          set -euo pipefail
          ORIGIN="$(pnpm exec tsx scripts/cloudflare/assert-preview-worker-secrets.ts origin --deploy-json preview-deploy.json)"
          echo "origin=${ORIGIN}" >> "$GITHUB_OUTPUT"
          PREVIEW_WORKER_ORIGIN="${ORIGIN}" \
            pnpm exec tsx scripts/cloudflare/assert-preview-worker-secrets.ts write \
            --pr ${{ github.event.pull_request.number }} \
            > secrets-file-path.txt
          echo "file=$(cat secrets-file-path.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload preview Worker secrets
        if: steps.creds.outputs.ready == 'true' && github.event_name == 'pull_request'
        working-directory: apps/web
        run: |
          set -euo pipefail
          SECRETS_FILE="$(cat secrets-file-path.txt)"
          pnpm exec wrangler preview secret bulk "${SECRETS_FILE}" \
            --name "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} preview secrets @ ${GITHUB_SHA::7}"
          rm -f "${SECRETS_FILE}"

      - name: Audit preview secret allowlist
        if: steps.creds.outputs.ready == 'true' && github.event_name == 'pull_request'
        working-directory: apps/web
        run: >-
          pnpm exec tsx scripts/cloudflare/assert-preview-worker-secrets.ts
          audit
          --pr ${{ github.event.pull_request.number }}

      - name: Preview URL
        if: steps.creds.outputs.ready == 'true' && github.event_name == 'pull_request'
        run: |
          echo "Cloudflare preview: ${{ steps.preview_secrets.outputs.origin }}" >> "$GITHUB_STEP_SUMMARY"
