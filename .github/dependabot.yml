version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    groups:
      pi:
        patterns:
          - "@earendil-works/*"
          - "pi-*"
        update-types:
          - "minor"
          - "patch"
      auth:
        patterns:
          - "better-auth"
          - "@neondatabase/*"
        update-types:
          - "minor"
          - "patch"
      ui:
        patterns:
          - "react"
          - "react-dom"
          - "@radix-ui/*"
          - "tailwindcss"
          - "lucide-react"
        update-types:
          - "minor"
          - "patch"
      tooling:
        patterns:
          - "*"
        exclude-patterns:
          - "@earendil-works/*"
          - "pi-*"
          - "better-auth"
          - "@neondatabase/*"
          - "react"
          - "react-dom"
          - "@radix-ui/*"
          - "tailwindcss"
          - "lucide-react"
        update-types:
          - "minor"
          - "patch"
    # No explicit ignore rules are currently required.
    # All dependencies in this monorepo are maintained through Dependabot.
    # If a dependency needs to be pinned or excluded, add it here:
    # ignore:
    #   - dependency-name: "example-package"
    #     versions: [">= 2.0.0"]
