# CircleCI pipeline for Fleet Pi.
#
# Validation mirrors the gates in .github/workflows/ci.yml: lint/format/guards,
# typecheck, syncpack, workspace unit tests through Smarter Testing, build, knip,
# jscpd, the tech-debt scan (inside lint), the AGENTS.md command check, and the
# deployment-readiness gate.
#
# Deployment split: GitHub Actions keeps auto-deploying the Worker on every main
# push (`.github/workflows/cloudflare.yml`). This pipeline adds `deploy-readiness`
# on every push, and an approval-gated production redeploy that records a
# CircleCI deployment for tracking and rollback. It never runs unattended, so it
# cannot race the GitHub Actions deploy. PR previews and Neon preview branches
# stay on GitHub Actions.
#
# House style follows the sister repos in this org (see
# Qredence/fleet-prime-agent/.circleci/config.yml): no orbs, pnpm installed by
# hand, because corepack and the node orb fight pnpm 11.

version: 2.1

# Component and environment names for CircleCI deploy tracking. `circleci run
# release plan` creates the component when it does not exist yet.
parameters:
  deploy_component:
    type: string
    default: fleet-pi-web
  deploy_environment:
    type: string
    default: production

executors:
  node-lts:
    docker:
      - image: cimg/node:24.22.2
    resource_class: medium
    working_directory: ~/project

  # Heavier jobs: the Vite build with rollup-plugin-visualizer, and
  # validate-agents-md which re-runs most of the gates.
  node-heavy:
    docker:
      - image: cimg/node:24.22.2
    resource_class: medium+
    working_directory: ~/project

commands:
  install-pnpm:
    parameters:
      pnpm_version:
        type: string
        default: "11.1.3"
    steps:
      - run:
          name: Install pnpm << parameters.pnpm_version >>
          command: |
            pnpm_root="${HOME}/.cache/fleet-pnpm"
            mkdir -p "${pnpm_root}"
            npm install --prefix "${pnpm_root}" --no-save --no-package-lock \
              --ignore-scripts --no-audit --no-fund "pnpm@<< parameters.pnpm_version >>"
            pnpm_bin="${pnpm_root}/node_modules/pnpm/bin/pnpm.cjs"
            pnpm_bin_dir="${pnpm_root}/node_modules/.bin"
            if [ ! -f "${pnpm_bin}" ]; then
              echo "Expected pnpm launcher was not installed at ${pnpm_bin}" >&2
              exit 1
            fi
            if [ ! -x "${pnpm_bin_dir}/pnpm" ]; then
              echo "Expected pnpm executable was not installed at ${pnpm_bin_dir}/pnpm" >&2
              exit 1
            fi
            {
              echo "export FLEET_PNPM_BIN=\"${pnpm_bin}\""
              echo "export PATH=\"${pnpm_bin_dir}:\$PATH\""
              echo 'export npm_config_manage_package_manager_versions=false'
              echo 'pnpm() { node "${FLEET_PNPM_BIN}" "$@"; }'
            } >> "${BASH_ENV}"
            export FLEET_PNPM_BIN="${pnpm_bin}"
            export PATH="${pnpm_bin_dir}:${PATH}"
            export npm_config_manage_package_manager_versions=false
            pnpm config set store-dir ~/.cache/pnpm
            pnpm --version

  install-dependencies:
    parameters:
      # Only one job should write the store cache: CircleCI saves are
      # first-writer-wins, so N concurrent savers just discard N-1 uploads.
      # Every other job restores and tops up in memory instead.
      save_store:
        type: boolean
        default: false
    steps:
      - restore_cache:
          keys:
            # Exact lockfile match first; otherwise fall back to any older
            # store, which pnpm tops up. The store only holds content-addressable
            # tarballs, so this cannot violate --frozen-lockfile.
            - v1-linux-node24-pnpm-{{ checksum "pnpm-lock.yaml" }}
            - v1-linux-node24-pnpm-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
          # Cold installs download native binaries (workerd, better-sqlite3)
          # without printing anything for long stretches.
          no_output_timeout: 20m
      - when:
          condition: << parameters.save_store >>
          steps:
            - save_cache:
                key: v1-linux-node24-pnpm-{{ checksum "pnpm-lock.yaml" }}
                paths:
                  - ~/.cache/pnpm

  # Marks the CircleCI deployment record for this pipeline. `plan` opens a
  # PENDING deployment in the Deploys UI; `update` moves it to RUNNING, SUCCESS,
  # FAILED or CANCELED. `circleci run release` ships in CircleCI's images but is
  # not in the local CLI, so this only works inside a job.
  plan-deploy-marker:
    parameters:
      deploy_name:
        type: string
    steps:
      - run:
          name: Plan the CircleCI deployment record
          command: |
            circleci run release plan << parameters.deploy_name >> \
              --environment-name=<< pipeline.parameters.deploy_environment >> \
              --component-name=<< pipeline.parameters.deploy_component >> \
              --target-version="${CIRCLE_SHA1:0:7}"

jobs:
  lint:
    executor: node-lts
    steps:
      - checkout
      - install-pnpm
      - install-dependencies
      - run:
          name: Lint
          command: pnpm exec vp check --no-fmt
      - run:
          name: Check formatting
          command: pnpm exec vp fmt --check
      - run:
          name: Guard against retired ESLint/Prettier tooling
          command: pnpm guard:no-eslint-prettier
      - run:
          name: Check OpenUI signatures
          command: pnpm generate:openui-signatures -- --check
      - run:
          name: Check OpenAPI spec drift
          command: pnpm generate:openapi -- --check
      # Folded in rather than given its own job: the scan is 0.66s of real work,
      # and a separate job spent ~55s on VM setup plus a 15s pnpm install to run
      # it. This job already installs apt packages, so ripgrep costs ~6s here.
      # Non-blocking by design — see the exit-code handling below.
      - run:
          name: Install ripgrep for the tech-debt scan
          command: |
            sudo apt-get update
            sudo apt-get install -y ripgrep
      - run:
          name: Scan for tech-debt markers (non-blocking)
          command: |
            set +e
            pnpm tech-debt
            status=$?
            set -e
            if [ "${status}" -eq 1 ]; then
              echo "Tech-debt markers found (exit 1). This gate is informational; see the tech-debt-report artifact."
              exit 0
            fi
            exit "${status}"
      - store_artifacts:
          path: tech-debt-report.json
          destination: tech-debt-report.json
          when: always

  typecheck:
    executor: node-lts
    steps:
      - checkout
      - install-pnpm
      - install-dependencies
      - run:
          name: Typecheck all workspaces
          command: pnpm typecheck
          no_output_timeout: 20m

  syncpack:
    executor: node-lts
    steps:
      - checkout
      - install-pnpm
      - install-dependencies
      - run:
          name: Check dependency version drift
          command: pnpm syncpack

  test:
    executor: node-lts
    parallelism: 2
    steps:
      - checkout
      - install-pnpm
      - install-dependencies
      # The latest CircleCI CLI in the image ships the testsuite subcommand.
      # Fail early with a clear message if it is missing.
      - run:
          name: Verify Smarter Testing CLI
          command: circleci testsuite --help >/dev/null
      # Smarter Testing replaces the raw web test command. GitHub Actions keeps
      # running the raw Vitest suites.
      - run:
          name: Run web unit suite
          command: circleci testsuite run "web-unit"
          no_output_timeout: 20m
      - run:
          name: Run web Workers suite
          command: circleci testsuite run "web-workers"
          no_output_timeout: 20m
      - run:
          name: Run pi-protocol suite
          command: circleci testsuite run "pi-protocol"
          no_output_timeout: 20m
      - run:
          name: Run hax-design suite
          command: circleci testsuite run "hax-design"
          no_output_timeout: 20m
      - store_test_results:
          path: test-reports
          when: always

  build:
    executor: node-heavy
    environment:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - checkout
      - install-pnpm
      # The only job that writes the store cache. It is a root job with no
      # `requires`, so it saves early and every later job restores a warm store.
      - install-dependencies:
          save_store: true
      - run:
          name: Build
          command: pnpm build
          # Turbo hides successful task output, so a long build can look silent.
          no_output_timeout: 20m
      - store_artifacts:
          path: apps/web/bundle-report
          destination: bundle-report

  knip:
    executor: node-lts
    steps:
      - checkout
      - install-pnpm
      - install-dependencies
      - run:
          name: Find unused files, exports and dependencies
          command: pnpm knip

  jscpd:
    executor: node-lts
    steps:
      - checkout
      - install-pnpm
      - install-dependencies
      - run:
          name: Scan for copy-paste duplication
          command: pnpm jscpd
      - store_artifacts:
          path: report
          destination: jscpd-report
          when: always

  validate-agents-md:
    executor: node-heavy
    steps:
      - checkout
      - install-pnpm
      - install-dependencies
      # scripts/validate-agents-md.js executes every backticked pnpm command in
      # AGENTS.md, so this step re-runs most of the gates above and can sit
      # quiet for a while. CircleCI's default no-output timeout is 10m.
      - run:
          name: Validate the AGENTS.md command set
          command: pnpm validate-agents-md
          no_output_timeout: 25m

  # Parity with .github/workflows/ci.yml's `cloudflare-release-gate`: proves the
  # Worker builds and that deployment readiness holds for both trust zones.
  # Deliberately needs no credentials — the migration probes self-skip.
  deploy-readiness:
    executor: node-heavy
    steps:
      - checkout
      - install-pnpm
      - install-dependencies
      - run:
          name: Build Cloudflare Worker
          command: pnpm --filter web build:cloudflare
          environment:
            VITE_NEON_AUTH_URL: https://auth.ci.example
          no_output_timeout: 20m
      - run:
          name: Verify deployment readiness (env-only)
          command: pnpm verify-deployment-readiness
          environment:
            FLEET_PI_DEPLOYMENT: cloudflare
            NEON_AUTH_BASE_URL: https://auth.ci.example
            NEON_AUTH_COOKIE_SECRET: ci-placeholder-cookie-secret-32chars
            NEON_AUTH_JWKS_URL: https://auth.ci.example/.well-known/jwks.json
            NEON_AUTH_ISSUER: https://auth.ci.example
            VITE_NEON_AUTH_URL: https://auth.ci.example
            BETTER_AUTH_SECRET: ci-placeholder-secret-32chars-min
            BETTER_AUTH_URL: https://fleet-pi-web.ci.workers.dev
            BETTER_AUTH_TRUSTED_ORIGINS: https://fleet-pi-web.ci.workers.dev
            FLEET_PI_CHAT_DATABASE_URL: postgres://ci-chat
            NEON_AI_GATEWAY_TOKEN: ci-gateway-token
            NEON_AI_GATEWAY_BASE_URL: https://ci-gateway.neon.tech
      - run:
          name: Verify preview trust-zone contract
          command: pnpm verify-deployment-readiness
          environment:
            FLEET_PI_DEPLOYMENT: cloudflare
            FLEET_PI_DEPLOYMENT_TRUST_ZONE: preview
            NEON_AUTH_BASE_URL: https://auth.preview.ci.example
            NEON_AUTH_COOKIE_SECRET: ci-placeholder-cookie-secret-32chars
            NEON_AUTH_JWKS_URL: https://auth.preview.ci.example/.well-known/jwks.json
            NEON_AUTH_ISSUER: https://auth.preview.ci.example
            VITE_NEON_AUTH_URL: https://auth.preview.ci.example
            BETTER_AUTH_SECRET: ci-placeholder-secret-32chars-min
            BETTER_AUTH_URL: https://pr-0.fleet-pi-web.ci.workers.dev
            BETTER_AUTH_TRUSTED_ORIGINS: https://pr-0.fleet-pi-web.ci.workers.dev
            FLEET_PI_CHAT_DATABASE_URL: postgres://preview-neon-host/preview-chat
            FLEET_PI_PRODUCTION_CHAT_DATABASE_URL: postgres://prod-neon-host/production-chat
            FLEET_PI_PREVIEW_DATABASE_MARKER: preview-neon
            FLEET_PI_PRODUCTION_DATABASE_MARKER: prod-neon
            NEON_AI_GATEWAY_TOKEN: ci-gateway-token
            NEON_AI_GATEWAY_BASE_URL: https://ci-gateway.neon.tech
      - run:
          name: Verify deployment readiness (migration probes)
          command: |
            if [ -z "${FLEET_PI_CHAT_MIGRATION_DATABASE_URL}" ]; then
              echo "Skipping live migration probes; chat migration URL is not configured."
              exit 0
            fi
            pnpm verify-deployment-readiness
          environment:
            FLEET_PI_DEPLOYMENT: cloudflare
            NEON_AUTH_BASE_URL: https://auth.ci.example
            NEON_AUTH_COOKIE_SECRET: ci-placeholder-cookie-secret-32chars
            NEON_AUTH_JWKS_URL: https://auth.ci.example/.well-known/jwks.json
            NEON_AUTH_ISSUER: https://auth.ci.example
            VITE_NEON_AUTH_URL: https://auth.ci.example
            BETTER_AUTH_SECRET: ci-placeholder-secret-32chars-min
            BETTER_AUTH_URL: https://fleet-pi-web.ci.workers.dev
            BETTER_AUTH_TRUSTED_ORIGINS: https://fleet-pi-web.ci.workers.dev
            FLEET_PI_CHAT_DATABASE_URL: postgres://ci-chat
            NEON_AI_GATEWAY_TOKEN: ci-gateway-token
            NEON_AI_GATEWAY_BASE_URL: https://ci-gateway.neon.tech
            FLEET_PI_READINESS_REQUIRE_MIGRATION_PROBES: "1"

  # Production deploy. CircleCI is the single deployer for main; the GitHub
  # Actions `cloudflare.yml` production path is retired so exactly one pipeline
  # owns the `fleet-pi-web` Worker.
  #
  # Auto-runs once deploy-readiness passes, with no human gate: the wait points
  # live *before* the mutating step (deploy-readiness is what proves the Worker
  # builds and the env contract holds), not after it. The GitHub Actions
  # workflow previously deployed `main` unconditionally on every push, so this
  # is strictly the stricter path, not a looser one.
  #
  # Requires the `fleet-pi-deploy` context: CLOUDFLARE_API_TOKEN,
  # CLOUDFLARE_ACCOUNT_ID, and VITE_NEON_AUTH_URL. The last one matters more
  # than it looks: it is compiled in by Vite at build time and is the *only*
  # signal that turns Managed Auth on in the client. A build without it ships
  # an app that falls back to local anonymous auth.
  deploy-production:
    executor: node-heavy
    environment:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - checkout
      - install-pnpm
      - install-dependencies
      # Guard before doing any work, so a missing var fails loudly instead of
      # silently shipping a build with Managed Auth disabled.
      - run:
          name: Verify deploy configuration
          command: |
            missing=""
            for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_NEON_AUTH_URL; do
              if [ -z "$(eval "printf '%s' \"\${${name}:-}\"")" ]; then
                missing="${missing} ${name}"
              fi
            done
            if [ -n "${missing}" ]; then
              echo "Missing required deploy variable(s):${missing}" >&2
              echo "Expected from the fleet-pi-deploy context and the deploy environment." >&2
              exit 1
            fi
            case "${VITE_NEON_AUTH_URL}" in
              *ci.example*|http://localhost*|http://127.0.0.1*)
                echo "VITE_NEON_AUTH_URL looks like a placeholder: ${VITE_NEON_AUTH_URL}" >&2
                echo "Refusing to deploy a build with Managed Auth disabled." >&2
                exit 1
                ;;
            esac
            echo "Deploy configuration present."
      - plan-deploy-marker:
          deploy_name: fleet-pi-web-deploy
      - run:
          name: Mark the deployment running
          command: circleci run release update fleet-pi-web-deploy --status=RUNNING
      - run:
          name: Build Cloudflare Worker
          # VITE_NEON_AUTH_URL is compiled in by Vite here; it must be in scope
          # for the build step, not only for deploy. The context supplies it.
          command: pnpm --filter web build:cloudflare
          no_output_timeout: 20m
          environment:
            VITE_NEON_AUTH_URL: ${VITE_NEON_AUTH_URL}
      - run:
          name: Deploy to Cloudflare
          # `--filter web exec` runs wrangler with the repo root as cwd, and
          # wrangler refuses to resolve a workspace member's config from there:
          #   "The Cloudflare application detection logic has been run in the
          #    root of a workspace instead of targeting a specific project."
          # Run it from apps/web so `wrangler.jsonc` is found.
          command: |
            cd apps/web
            pnpm exec wrangler deploy --message "${CIRCLE_SHA1:0:7}"
          no_output_timeout: 20m
      - run:
          name: Mark the deployment successful
          command: circleci run release update fleet-pi-web-deploy --status=SUCCESS
          when: on_success
      - run:
          name: Mark the deployment failed
          command: |
            circleci run release update fleet-pi-web-deploy \
              --status=FAILED \
              --failure-reason="wrangler deploy failed"
          when: on_fail

  cancel-deploy-marker:
    executor: node-lts
    steps:
      - run:
          name: Mark the deployment canceled
          command: circleci run release update fleet-pi-web-deploy --status=CANCELED

workflows:
  ci:
    jobs:
      - lint:
          filters: &branch-only
            tags:
              ignore: /.*/
      - typecheck:
          filters: *branch-only
      - syncpack:
          filters: *branch-only
      - knip:
          filters: *branch-only
      - jscpd:
          filters: *branch-only
      - test:
          requires:
            - lint
            - typecheck
          filters: *branch-only
      - build:
          requires:
            - lint
            - typecheck
          filters: *branch-only
      # No `requires`: this job re-runs most of the gates and is the longest
      # single job, so gating it behind `test` adds the whole web suite to the
      # critical path. scripts/validate-agents-md.js skips `pnpm test` when CI is
      # set precisely so the two can run in parallel.
      - validate-agents-md:
          filters: *branch-only
      - deploy-readiness:
          requires:
            - lint
            - typecheck
          filters: *branch-only

      # Production deploy, main only. No approval gate: deploy-readiness is the
      # safety check, and it already ran above. `serial-group` keeps two deploys
      # from overlapping when pushes land close together.
      - deploy-production:
          requires:
            - deploy-readiness
          context:
            - fleet-pi-deploy
          serial-group: fleet-pi-production-deploy
          filters: &main-only
            branches:
              only: main
            tags:
              ignore: /.*/
      - cancel-deploy-marker:
          requires:
            - deploy-production:
                - canceled
          filters: *main-only
