# Manual rollback pipeline for the Fleet Pi Worker.
#
# Started by hand via `circleci pipeline run`, never by a trigger:
#
#   circleci pipeline run --project circleci/SomxVLJYMpo86z6XUrZBUq/<project-id> \
#     --definition-id <rollback-definition-id> \
#     --branch main \
#     --parameters target_version=<cloudflare-worker-version-id> \
#     --parameters reason="why" \
#     --json
#
# List the candidates for target_version with:
#   pnpm --filter web exec wrangler deployments list --name fleet-pi-web

version: 2.1

parameters:
  target_version:
    type: string
    default: ""
    description: Cloudflare Worker version id to roll back to.
  reason:
    type: string
    default: manual rollback

executors:
  node-heavy:
    docker:
      - image: cimg/node:24.22.2
    resource_class: medium+
    working_directory: ~/project

commands:
  install-pnpm:
    parameters:
      pnpm_version:
        type: string
        default: "11.1.3"
    steps:
      - run:
          name: Install pnpm << parameters.pnpm_version >>
          command: |
            pnpm_root="${HOME}/.cache/fleet-pnpm"
            mkdir -p "${pnpm_root}"
            npm install --prefix "${pnpm_root}" --no-save --no-package-lock \
              --ignore-scripts --no-audit --no-fund "pnpm@<< parameters.pnpm_version >>"
            pnpm_bin="${pnpm_root}/node_modules/pnpm/bin/pnpm.cjs"
            pnpm_bin_dir="${pnpm_root}/node_modules/.bin"
            if [ ! -f "${pnpm_bin}" ]; then
              echo "Expected pnpm launcher was not installed at ${pnpm_bin}" >&2
              exit 1
            fi
            if [ ! -x "${pnpm_bin_dir}/pnpm" ]; then
              echo "Expected pnpm executable was not installed at ${pnpm_bin_dir}/pnpm" >&2
              exit 1
            fi
            {
              echo "export FLEET_PNPM_BIN=\"${pnpm_bin}\""
              echo "export PATH=\"${pnpm_bin_dir}:\$PATH\""
              echo 'export npm_config_manage_package_manager_versions=false'
              echo 'pnpm() { node "${FLEET_PNPM_BIN}" "$@"; }'
            } >> "${BASH_ENV}"
            export FLEET_PNPM_BIN="${pnpm_bin}"
            export PATH="${pnpm_bin_dir}:${PATH}"
            export npm_config_manage_package_manager_versions=false
            pnpm config set store-dir ~/.cache/pnpm
            pnpm --version

  install-dependencies:
    steps:
      - restore_cache:
          keys:
            - v1-linux-node24-pnpm-{{ checksum "pnpm-lock.yaml" }}
            - v1-linux-node24-pnpm-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
          no_output_timeout: 20m

jobs:
  rollback-worker:
    executor: node-heavy
    environment:
      TARGET_VERSION: << pipeline.parameters.target_version >>
      ROLLBACK_REASON: << pipeline.parameters.reason >>
    steps:
      - checkout
      - install-pnpm
      - install-dependencies
      - run:
          name: Validate the rollback request
          command: |
            set -euo pipefail
            if [ -z "${TARGET_VERSION}" ]; then
              echo "target_version is required; pass --parameters target_version=<worker-version-id>" >&2
              exit 1
            fi
            echo "Rolling fleet-pi-web back to ${TARGET_VERSION}"
            echo "Reason: ${ROLLBACK_REASON}"
      - run:
          name: Roll back the Worker
          command: |
            set -euo pipefail
            pnpm --filter web exec wrangler rollback "${TARGET_VERSION}" \
              --name fleet-pi-web \
              --message "rollback: ${ROLLBACK_REASON}" \
              --yes
          no_output_timeout: 20m

workflows:
  rollback:
    jobs:
      - rollback-worker
