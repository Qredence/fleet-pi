# CircleCI Smarter Testing suites.
#
# Each suite runs its package's Vitest config through pnpm, so discover and run
# share the package cwd and test atoms stay package-relative. `outputs.junit`
# is intentionally omitted: the testsuite creates an absolute temp path, which
# Vitest resolves unchanged. The run step copies that report into the
# repo-root `test-reports/` directory used by `store_test_results`.
---
name: web-unit
discover: pnpm --filter web exec vitest list --filesOnly --config vitest.config.ts
run: |
  export FLEET_PI_JUNIT_OUTPUT="<< outputs.junit >>"
  status=0
  pnpm --filter web exec vitest run --config vitest.testsuite.config.ts << test.atoms >> || status=$?
  mkdir -p test-reports
  cp "$FLEET_PI_JUNIT_OUTPUT" test-reports/web-unit.xml || true
  exit "$status"
