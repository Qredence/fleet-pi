  ip-address: '>=10.1.1'
  hono: '>=4.12.25'
  qs: '>=6.15.2'
  mermaid: '>=11.15.0'
  shell-quote: '>=1.8.4'
  '@grpc/grpc-js': '>=1.14.4'
