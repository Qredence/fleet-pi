  '@anthropic-ai/sdk': '>=0.91.1'
  handlebars: '>=4.7.9'
  flatted: '>=3.4.2'
  lodash: '>=4.18.0'
  undici: '>=8.9.0'
  h3: '>=2.0.1-rc.17'
  '@tanstack/start-server-core>h3': '>=2.0.1-rc.17'
  fast-uri: '^4.1.5'
  uuid: '>=11.1.1'
  ip-address: '^10.7.1'
  hono: '^4.13.7'
  better-auth: '>=1.6.22'
  qs: '^6.16.0'
  mermaid: '^11.16.1'
  shell-quote: '>=1.8.4'
  '@grpc/grpc-js': '^1.14.5'
  form-data: '>=4.0.6'
  dompurify: '^3.4.13'
  esbuild: '>=0.28.1'
  '@opentelemetry/core': '>=2.8.0'
  tar: '>=7.5.21'
  '@google/genai>protobufjs': '>=8.6.6'
  '@opentelemetry/otlp-transformer>protobufjs': '>=8.6.6'
  '@grpc/proto-loader>protobufjs': '>=8.6.6'
  protobufjs: '>=8.6.6'
  axios: '^1.20.0'
  brace-expansion: '^5.0.10'
  postcss: '>=8.5.18'
  body-parser: '>=2.3.0'
  '@hono/node-server': '>=2.0.10'
  '@opentelemetry/propagator-jaeger': '>=2.9.0'
  'ws@>=8.0.0 <8.21.0': '>=8.21.0'
  vite: '>=8.0.16'
  # @daytona/sdk ESM needs tslib@2 `__esDecorate`; Neon Auth passkey pulls tslib@1.
  tslib: '>=2.8.1'
  js-yaml: '^5.4.1'
  '@babel/core': '>=7.29.6 <7.29.7'
  # Security floors for transitive deps flagged by Dependabot (2026-10).
  browserslist: '^4.28.7'
  baseline-browser-mapping: '^2.11.0'
  smol-toml: '^1.7.1'
  'nanoid@<3.3.18': '^3.3.18'
  'fflate@>=0.4.5 <0.4.9': '^0.4.9'
  'postcss-selector-parser@>=7.1.0 <7.1.3': '^7.1.3'
allowBuilds:
  '@google/genai': true
  better-sqlite3: true
  core-js: false
  esbuild: true
  koffi: true
  msw: true
  protobufjs: true
  unrs-resolver: true
# pnpm 11 (pinned via package.json#packageManager, used locally, in CI and on Vercel)
# defaults minimumReleaseAge to 1440 (24h): versions published < 24h ago cannot be
# installed, so a dependabot PR pinning a freshly-published version fails install with
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION.
# Waive the guard ONLY for these trusted, high-churn publishers; it stays ON for
# everything else. pnpm gives NO warning for an entry that matches nothing, so keep
# names exact and prune an entry when its package stops being bumped weekly / pins a
# stable major. Verified against the 2026-07-27/28 (19 blocked) and 2026-07-28
# (@tabler/icons-react, @tabler/icons, posthog-js) Vercel dependabot failures.
minimumReleaseAgeExclude:
  # Vendored Pi toolchain (internal to this stack; bumped by dependabot).
  - '@earendil-works/pi-agent-core'
  - '@earendil-works/pi-ai'
  - '@earendil-works/pi-coding-agent'
  - '@earendil-works/pi-tui'
  # AWS SDK (transitive; single AWS publisher on a near-daily release train).
  - '@aws-sdk/*'
  # Motion family — four distinct published names; motion-dom/motion-utils are
  # motion's internal split, NOT covered by the 'motion' entry (exact-name match).
  - 'framer-motion'
  - 'motion'
  - 'motion-dom'
  - 'motion-utils'
  # Neon: 'neon' and the 'neon-init' CLI are unscoped, so @neon/* does NOT cover them.
  - 'neon'
  - 'neon-init'
  - '@neon/*'
  # shadcn registry CLI (direct dep of hax-design).
  - 'shadcn'
  # Tabler icons (direct dep of hax-design; @tabler/* covers icons + icons-react).
  - '@tabler/*'
  # PostHog analytics SDK (direct dep of web).
  - 'posthog-js'
  # Toolchain pins (insurance: not in the blocked-19, but same publishers re-release
  # <24h and would re-break dependabot previews). typescript/@types/node/better-sqlite3.
  - 'typescript'
  - '@types/node'
  - 'better-sqlite3'
  - 'jscpd'
