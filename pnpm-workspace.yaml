packages:
  - "apps/web"
  - "packages/hax-design"
  - "packages/pi-protocol"
overrides:
  '@anthropic-ai/sdk': '>=0.91.1'
  handlebars: '>=4.7.9'
  flatted: '>=3.4.2'
  lodash: '>=4.18.0'
  undici: '>=8.5.0'
  h3: '>=2.0.1-rc.17'
  '@tanstack/start-server-core>h3': '>=2.0.1-rc.17'
  fast-uri: '>=3.1.4'
  uuid: '>=11.1.1'
  ip-address: '>=10.1.1'
  hono: '>=4.12.25'
  qs: '>=6.15.2'
  mermaid: '>=11.15.0'
  shell-quote: '>=1.8.4'
  '@grpc/grpc-js': '>=1.14.4'
  form-data: '>=4.0.6'
  dompurify: '>=3.4.12'
  esbuild: '>=0.28.1'
  '@opentelemetry/core': '>=2.8.0'
  tar: '>=7.5.21'
  '@google/genai>protobufjs': '>=8.6.6'
  '@opentelemetry/otlp-transformer>protobufjs': '>=8.6.6'
  '@grpc/proto-loader>protobufjs': '>=8.6.6'
  protobufjs: '>=8.6.6'
  axios: '>=1.18.0'
  brace-expansion: '>=5.0.8'
  postcss: '>=8.5.18'
  body-parser: '>=2.3.0'
  '@hono/node-server': '>=2.0.10'
  '@opentelemetry/propagator-jaeger': '>=2.9.0'
  'ws@>=8.0.0 <8.21.0': '>=8.21.0'
  vite: '>=8.0.16'
  # @daytona/sdk ESM needs tslib@2 `__esDecorate`; Neon Auth passkey pulls tslib@1.
  tslib: '>=2.8.1'
  js-yaml: '>=5.2.2'
  '@babel/core': '>=7.29.6 <7.29.7'
allowBuilds:
  '@google/genai': true
  better-sqlite3: true
  core-js: false
  esbuild: true
  koffi: true
  msw: true
  protobufjs: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core'
  - '@earendil-works/pi-ai'
  - '@earendil-works/pi-coding-agent'
  - '@earendil-works/pi-tui'
